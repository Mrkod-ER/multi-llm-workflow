# docker-compose.override.yml
# ================================================
# Local development overrides — auto-merged on `docker compose up`
# Mount source dirs for hot-reload in dev. Not used in production.
# ================================================

services:

  backend:
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=true
      - LOG_LEVEL=debug
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      target: builder   # Use the builder stage (not runner) for dev hot-reload
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: npm run dev
