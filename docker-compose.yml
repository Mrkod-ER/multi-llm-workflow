version: "3.9"

# ================================================
# Multi-LLM Workflow Builder — Docker Compose
# ================================================

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mlw_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - mlw_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mlw_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mlw_network
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: mlw_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mlw_network

  ollama:
    image: ollama/ollama:latest
    container_name: mlw_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mlw_network

networks:
  mlw_network:
    driver: bridge

volumes:
  redis_data:
  ollama_data:
