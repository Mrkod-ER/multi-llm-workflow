version: "3.9"

# ================================================
# Multi-LLM Workflow Builder — Docker Compose
# ================================================
# Services will be added incrementally:
#   - backend  (FastAPI)
#   - frontend (React)
#   - redis    (Shared Memory)
#   - ollama   (Local LLM Runtime)

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mlw_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - mlw_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mlw_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mlw_network
    depends_on:
      - backend

networks:
  mlw_network:
    driver: bridge
