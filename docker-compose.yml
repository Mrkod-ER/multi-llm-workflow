version: "3.9"

# ================================================
# Multi-LLM Workflow Builder — Docker Compose
# ================================================
# Services will be added incrementally:
#   - backend  (FastAPI)
#   - frontend (React)
#   - redis    (Shared Memory)
#   - ollama   (Local LLM Runtime)

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mlw_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    networks:
      - mlw_network
